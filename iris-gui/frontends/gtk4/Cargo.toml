[package]
name = "iris-gui-gtk"
version = "0.1.0"
edition = "2021"
description = "IRIS, the native Linux front end: GTK 4 and libadwaita over iris-gui-core's controllers"
license = "BSD-3-Clause"
publish = false

# Phase 5 of clanker/plans/iris-newgui-plan.md, after the AppKit shell. A pure
# view over iris_gui_core::controller: it renders, maps input to actions and
# carries out effects. The toolkit is gated on the platforms that have it
# (D19), so `cargo build --workspace` on macOS or Windows builds a binary that
# only says so.

[[bin]]
name = "iris-gtk"
path = "src/main.rs"

# Packaging, for when the Linux packages carry this app instead of the egui
# one (scripts/dist/package-linux.sh). Asset paths resolve against this
# directory, as cargo-deb and cargo-generate-rpm read them.
[package.metadata.deb]
maintainer = "Dani Sarfati <dani@funkervogt.com>"
copyright = "2025 Dani Sarfati"
license-file = "../../../LICENSE"
extended-description = "IRIS emulates SGI Indy, Indigo2, O2, Octane, Origin, Onyx, Fuel and Tezro systems with runtime-selectable MIPS processors. It runs IRIX 6.5 and 5.3 with networking and graphical or serial consoles, depending on the machine."
# dpkg-shlibdeps resolves GTK, libadwaita and the pcap variant's libpcap to
# this distro's package names, so none of them is hardcoded here.
depends = "$auto"
maintainer-scripts = "../../../installer/linux"
section = "games"
priority = "optional"
assets = [
  ["../../../target/release/iris-gtk", "usr/bin/iris-gtk", "755"],
  ["../../assets/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/iris-gtk.png", "644"],
  ["../../assets/icons/icon-128.png", "usr/share/icons/hicolor/128x128/apps/iris-gtk.png", "644"],
  ["../../assets/icons/icon-64.png", "usr/share/icons/hicolor/64x64/apps/iris-gtk.png", "644"],
  ["iris-gtk.desktop", "usr/share/applications/iris-gtk.desktop", "644"],
]

[package.metadata.generate-rpm]
# cargo-generate-rpm detects no shared-library dependencies, so the toolkit
# and libpcap are named here.
requires = { libpcap = "*", gtk4 = "*", libadwaita = "*" }
post_install_script = '''
if command -v setcap >/dev/null 2>&1; then
    setcap cap_net_raw,cap_net_admin+eip /usr/bin/iris-gtk 2>/dev/null || true
fi
'''
assets = [
  { source = "../../../target/release/iris-gtk", dest = "/usr/bin/iris-gtk", mode = "755" },
  { source = "../../assets/icons/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/iris-gtk.png", mode = "644" },
  { source = "iris-gtk.desktop", dest = "/usr/share/applications/iris-gtk.desktop", mode = "644" },
]

[features]
# Forwarded to the core, as iris-gui does.
pcap = ["iris-gui-core/iris-pcap"]
# Distributed build (the packaging scripts set it).
bundled = ["iris-gui-core/bundled"]
# The emulator's speed features, as the egui release build uses them
# (scripts/dist/lib.sh DEFAULT_GUI_FEATURES).
lightning = ["iris/lightning"]
jitv2 = ["iris/jitv2"]
idle-pause = ["iris/idle-pause"]
hostgl = ["iris/hostgl", "iris/hostcall"]

[dependencies]
iris-gui-core = { path = "../../core" }
# Only so the features above reach the emulator. The shell's code never
# names it (iris-gui/scripts/check-boundaries.sh).
iris = { path = "../../..", features = ["gpujit"] }

# GTK 4.12 and libadwaita 1.5 are what Ubuntu 24.04 carries, and build.yml
# already builds the Linux packages there, so the floor costs nothing we ship.
[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
# Draws the shared icon set (iris-gui/assets/icons/*.svg); line art only, so
# no text, fonts or embedded images. GTK's own SVG support goes through
# gdk-pixbuf's loader, which is not installed everywhere.
resvg = { version = "0.50", default-features = false }
