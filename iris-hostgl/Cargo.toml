[package]
name = "iris-hostgl"
version = "0.1.0"
edition = "2021"
description = "Host OpenGL for IRIX programs under IRIS, through host call 3000"
license = "BSD-3-Clause"

[dependencies]
iris-hostcall = { path = "../iris-hostcall" }
log = "0.4"

# Backends: Apple's OpenGL.framework (CGL) on the Mac, EGL with libGL (glvnd)
# on Linux; elsewhere the crate builds and registers nothing.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"
