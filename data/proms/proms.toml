# The PROMs iris embeds. `url` is the published file and `sha256` its hash; iris-prom
# checks both and packs each file, deflated, into data/proms/<board>.deflate. The Octane's
# version is the main PROM's (4.17); its flash also holds a first-stage banner, Rev 4.9.
# `unwrap = false` stores a file as published instead of unwrapping it (default true): the IO6,
# which the IP27 PROM unpacks from the BaseIO flash itself.

format = 1

