# Nightly build: every day at 05:00 UTC, build main and replace the single
# "nightly" pre-release with it. The version is nightly.YYYY.MM.DD (UTC).
#
# A scheduled run does nothing when main has not moved since the last nightly.
# Run it by hand (Actions > Nightly > Run workflow) to build and publish now,
# changed or not.
#
# GitHub stops running schedules on a public repo after 60 days without a commit.

name: Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(scripts/dist/version.sh nightly)
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)
          SKIP=false
          if [ "$EVENT" = schedule ] && [ "$LAST" = "$SHA" ]; then
            SKIP=true
            echo "main has not moved since the last nightly (\`${SHA:0:8}\`). Nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Building \`$VERSION\` from \`${SHA:0:8}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}

  # Test sets the pull-request run leaves out, on x86-64 Linux: default features
  # (the pull-request run tests the jitv2 build, which excludes some paths), and
  # the four tests that need the instruction-driven clock. Publish does not wait
  # for it; a failure turns the run red without stopping the nightly.
  test-nightly-sets:
    name: Test (nightly feature sets)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      LIBCHDMAN_PREBUILT_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install pinned toolchain
        run: rustup show
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      # Restore main's cache; a scheduled run never saves one.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # v2.90.3
        with:
          tool: nextest
      - name: Run tests
        run: cargo nextest run --workspace --profile ci
      # ci_clock replaces the host clock with one driven by retired
      # instructions, so these tests can't share a build with the rest. Which
      # tests run is the ci-clock profile's filter in .config/nextest.toml.
      - name: Run the instruction-driven clock tests
        if: ${{ !cancelled() }}
        run: cargo nextest run --workspace --profile ci-clock --features jitv2,ci_clock,idle-pause
      - uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce  # v6.7.1
        if: ${{ !cancelled() }}
        with:
          report_paths: target/nextest/ci/junit.xml
          annotate_only: true

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Release notes
        run: >
          scripts/dist/release-notes.sh --channel nightly
          --version "${{ needs.prepare.outputs.version }}" --tag nightly
          --commit "${{ needs.prepare.outputs.sha }}"
          -o "$RUNNER_TEMP/notes.md"
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          scripts/dist/publish-github.sh --tag nightly --move-tag --prerelease
          --previous nightly
          --sha "${{ needs.prepare.outputs.sha }}"
          --title nightly
          --notes "$RUNNER_TEMP/notes.md" --dir dist
