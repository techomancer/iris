name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# Runner images match release.yml: ubuntu-24.04 (glibc floor), macos-26 (pinned
# through GitHub's macos-15 -> macos-26 migration; arm64), windows-latest (x64).
# fail-fast is off so one platform breaking still reports the others.
jobs:
  # Default features, every workspace crate, all three host platforms.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-24.04,   informational: false }
          - { name: macos,   os: macos-26,       informational: true }
          - { name: windows, os: windows-latest, informational: true }
    steps:
    - uses: actions/checkout@v5
    # rust-toolchain.toml pins nightly; `rustup show` installs it up front so a
    # toolchain download doesn't land inside the Build step's timing.
    - name: Install pinned toolchain
      run: rustup show
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-test-cargo-
    # --workspace, not the default. Without it cargo only builds and tests the
    # root `iris` package, so iris-gui was never compiled here at all and its
    # tests never ran — a GUI-only breakage could not turn this red. It needs no
    # extra system packages: wayland, X11 and GL are dlopen'd at runtime, so the
    # only thing it links is libasound, which is already installed above.
    - name: Build
      run: cargo build --workspace --verbose
    # macOS and Windows test results are informational: a failure is reported
    # (red step, annotation on the run) but does not fail the job or the
    # workflow. Shared runners there are slower and noisier, and several tests
    # read the wall clock. Their Build step above still gates; Linux gates on
    # both.
    - name: Run tests
      continue-on-error: ${{ matrix.informational }}
      run: cargo test --workspace --verbose

  # The speed configuration (CLAUDE.md "recommended for speed" plus the MIPS
  # JIT): a build check only, so a platform-specific break in the Cranelift
  # JITs or the lightning interpreter path turns CI red before a release does.
  features:
    name: Build lightning,gpujit,jitv2 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-24.04 }
          - { name: macos,   os: macos-26 }
          - { name: windows, os: windows-latest }
    steps:
    - uses: actions/checkout@v5
    - name: Install pinned toolchain
      run: rustup show
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-features-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-features-cargo-
    - name: Build
      run: cargo build --release -p iris --bins --features lightning,gpujit,jitv2
