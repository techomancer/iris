# The bare-metal suites — cpu-tests/ and bench/.
#
# One workflow because they are the same machine: both build a guest binary
# with the MIPS cross toolchain, then run it against IRIS. The engine (interp
# or jitv2) is a cargo feature and the CPU is a runtime flag, so each engine is
# built once and every CPU runs on that binary. The release profile is fat-LTO
# with codegen-units=1, so an emulator build is the dominant cost in this
# repo's CI; running another CPU on a built binary costs under a minute.
#
# The two suites answer different questions and neither replaces the other:
#
#   cpu-tests  is this instruction correct — one at a time, clean state.
#              R4400 vs R5000 because the mips4/ group requires each MIPS IV
#              instruction to compute on R5000 and raise Reserved Instruction
#              on R4400. interp vs jitv2 because a guest-visible ISA suite is
#              the cleanest JIT differential available. It does not run on the
#              R10000: every expectation in it is chosen by PRId, and it has
#              none for that CPU.
#
#   bench      is it still correct after ten million of them, with whatever
#              state the last million left — and how long did that take.
#
# CI gates bench on its ACCURACY score, never on its performance numbers: a
# shared runner's throughput varies by more than most real regressions, so a
# perf threshold would either catch nothing or fire every other week. The
# figures are still collected and uploaded so a run can be read after the fact.
#
# Both suites run on every CPU even when the first fails, so a cpu-tests
# failure never hides the benchmark's accuracy result. cpu-tests has known
# findings (cpu-tests/docs/findings.md); a cell passes when exactly the tests
# in cpu-tests/expected-failures.txt fail.

name: Bare-metal suites

on:
  push:
    branches: [ "main" ]
    paths: &suite_paths
      - 'cpu-tests/**'
      - 'bench/**'
      - 'src/cpu/mips_*.rs'
      - 'src/cpu/jitv2/**'
      - 'src/elf.rs'
      - 'src/dev/testdev.rs'
      - 'src/bench_report.rs'
      - 'src/bench_runner.rs'
      - 'src/benchsuite.rs'
      - 'src/bin/iris_bench.rs'
      - '.github/workflows/suites.yml'
  pull_request:
    branches: [ "main" ]
    paths: *suite_paths
  workflow_dispatch:

# One run per workflow per pull request: a new push cancels the runs it
# replaces. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  guests:
    name: Build the guest binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Every guest binary is built with the one pinned MIPS compiler, in the
      # container developers use (cpu-tests/docs/toolchain.md). The benchmark
      # measures compiled guest code, so CI building with another compiler
      # would test another benchmark.
      - name: Build the pinned MIPS toolchain
        run: docker build -t iris-guest-toolchain -f cpu-tests/toolchain.Containerfile cpu-tests

      # bench/prebuilt/irisbench.elf is linked into `iris` with include_bytes!
      # so the benchmark runs on a machine with no cross toolchain. Accuracy is
      # scored against golden checksums compiled *into* the image, so a stale
      # image reports failures to users that are not real, and an image from
      # another compiler silently changes every benchmark figure. Checked
      # before the rebuild below overwrites it; the version check names the
      # compiler, which the byte comparison afterwards cannot.
      - name: bench — checked-in guest binary was built by the pinned compiler
        run: make -C bench check-prebuilt

      # The FP vectors and golden checksums come from host programs, the guest
      # binaries from the pinned toolchain. `make vectors` also cross-checks its
      # exact rational arithmetic against the runner's own FPU, and the golden
      # run doubles as a determinism check: a kernel that depends on
      # uninitialised memory or host byte order produces a different table on
      # a different runner.
      - name: Regenerate and rebuild everything checked in
        run: |
          make -C cpu-tests vectors
          make -C bench golden
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
            iris-guest-toolchain sh -c 'make -C cpu-tests all && make -C bench prebuilt'

      - name: Checked-in generated files match what the generators build
        run: |
          git diff --exit-code --stat || {
            echo "::error::a checked-in generated file is stale. Rerun make -C cpu-tests vectors, make -C bench golden and make -C bench prebuilt (in the toolchain container), and commit the result."
            exit 1; }

      # One binary of each for every run below, which is what makes the
      # engines a differential test rather than independent runs.
      - uses: actions/upload-artifact@v7
        with:
          name: guest-elfs
          path: |
            cpu-tests/build/cputest.elf
            bench/build/irisbench.elf
          if-no-files-found: error

  # The same kernels, natively. Its accuracy score must be 100% by
  # construction, since it is the source of the golden values, so a failure
  # here means a kernel is not deterministic even against itself.
  host-baseline:
    name: Host baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and run
        run: |
          make -C bench hostbench
          ./bench/build/irisbench-host | tee bench/build/host.log
          grep -q 'IRIS-BENCH-DONE rc=0' bench/build/host.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-host-log
          path: bench/build/host.log
          if-no-files-found: ignore

  # The path a released application takes: no subprocess, no ELF on disk, the
  # guest image read straight out of the binary. It exercises the plumbing, not
  # the CPU model, so one run is enough.
  embedded:
    name: Embedded runner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --release --lib bench_runner -- --ignored --nocapture

  suites:
    name: ${{ matrix.engine }}
    needs: guests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: interp
            features: ""
          - engine: jitv2
            features: jitv2
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: actions/download-artifact@v8
        with:
          name: guest-elfs
          path: .

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # iris-bench embeds the guest image and can run the suite in-process, so
      # it is built with the same features: a default-feature build would
      # quietly be a different machine from the one this job is named after.
      # jitv2 is the only MIPS JIT and is active as soon as it is compiled in.
      - name: Build IRIS
        run: cargo build --release --bin iris --bin iris-bench --features "${{ matrix.features }}"

      # The R5000 is the R5000 without a secondary cache: r5ksc is refused at
      # compile time (src/lib.rs). It matters here only because CPU/FPU
      # correctness does not depend on it.
      - name: cpu-tests
        run: |
          rc=0
          for cpu in r4400 r5000; do
            make -C cpu-tests check-run PREBUILT=1 CPU=$cpu ENGINE=${{ matrix.engine }} || rc=1
          done
          exit $rc

      # --iris is required, not decorative: without it `run` measures the
      # in-process emulator, which is not the binary built above. The R10000
      # always runs the shadow caches, so the default build covers it.
      - name: bench
        if: ${{ !cancelled() }}
        run: |
          rc=0
          for cpu in r4400 r5000 r10000_195; do
            make -C bench check-run PREBUILT=1 CPU=$cpu ENGINE=${{ matrix.engine }} || rc=1
          done
          exit $rc

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          { echo "### ${{ matrix.engine }}"; echo '```'
            grep -HE '^ RESULT:|accuracy|emulator speed' cpu-tests/build/*.log bench/build/*.log
            echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: suites-${{ matrix.engine }}
          path: |
            cpu-tests/build/*.log
            cpu-tests/build/dump.json
            bench/build/*.log
            bench/build/results/*.json
          if-no-files-found: ignore

      # The comparison report needs only this binary.
      - uses: actions/upload-artifact@v7
        if: matrix.engine == 'interp'
        with:
          name: iris-bench
          path: target/release/iris-bench

  report:
    name: Comparison report
    needs: suites
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # iris-bench links libasound at run time.
      - run: sudo apt-get update && sudo apt-get install -y libasound2t64
      - uses: actions/download-artifact@v8
        with:
          name: iris-bench
          path: target/release
      - uses: actions/download-artifact@v8
        with:
          pattern: suites-*
          path: artifacts
          merge-multiple: true
      # Path-qualified: the artifact also holds cpu-tests' machine-state dump,
      # and `iris-bench report` parses everything in this directory as a result.
      - name: Report
        run: |
          mkdir -p bench/build/results
          find artifacts -path '*/bench/build/results/*' -name '*.json' -exec cp {} bench/build/results/ \;
          chmod +x target/release/iris-bench
          ./target/release/iris-bench report --format md | tee bench/build/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: bench/build/report.md
          if-no-files-found: ignore
