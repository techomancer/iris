# CI's profile (.github/workflows/rust.yml and suites.yml). Every failure is
# reported, and the JUnit report feeds the run's test annotations.
[profile.ci]
fail-fast = false
# A hung test ends at 20 x 60s, not at the job's 60 minutes.
slow-timeout = { period = "60s", terminate-after = 20 }

[profile.ci.junit]
path = "junit.xml"

# The tests that exist only in a `ci_clock` build, where the CP0 Count and the
# test device's clock follow retired instructions, so they cannot share a build
# with the rest. Name such a test `ci_clock_...` (after its module path) and this profile runs it; no
# workflow lists tests by name. Run it with
# `cargo nextest run --profile ci-clock --features jitv2,ci_clock,idle-pause`
# (the idle park test also needs idle-pause).
[profile.ci-clock]
default-filter = 'test(/::ci_clock_/)'
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 20 }

# The threaded device tests that the nightly ThreadSanitizer run covers
# (.github/workflows/tsan.yml). Add a test to a device module with one of these
# names and it joins the run; the workflow lists nothing.
#
# Left out, because the sanitizer reports them for reasons that are not races
# worth chasing in this job:
# - ppmem: its plain read of a word that another thread updates with an atomic
#   is the lock-free design, and the sanitizer reports it on every run.
# - isp1040 and isp12160: eight tests that count interrupt-line writes see one
#   extra initial false write under the sanitizer build. They pass in a plain
#   release build, so this looks like a test race (the ring thread starts
#   before the line is wired), not a data race. Put them back once it is fixed.
[profile.tsan]
default-filter = 'test(/ioc3|hub|intx|bridge/) - test(/ppmem|isp1040|isp12160/)'
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 20 }
