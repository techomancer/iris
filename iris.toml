# iris.toml — IRIS emulator configuration
# All paths are relative to the directory you run iris from.
# Command-line flags override any value set here.

# Run without a window. On the Indy and Indigo2 this leaves out Newport (REX3);
# other graphics boards stay fitted, and the O2 boots on its serial console.
# Independent of audio. Can also be set with the --headless command-line flag.
headless = false

# No sound to the host. On the Indy and Indigo2 HAL2 is left out; the other
# machines keep their sound device, which plays to nowhere. Independent of
# graphics/headless. Can also be set with --noaudio.
no_audio = false

# PROM ROM image: an override. Every machine has a built-in PROM that runs
# when this is left as is, and "(embedded)" selects it outright. A file named here
# must load. With this left as is, prom.bin or the machine's release file name
# (the O2's ip32prom.rev4.18.bin, the Indigo2's 070-1367-012.bin) is used instead
# if it is in the working directory. `cargo run -p iris-prom -- show FILE` says
# what a PROM file holds.
prom = "prom.bin"

# Window scale factor. Uses logical points (macOS) / DPI-scaled pixels, so
# scale=2 is visibly ~2× bigger than scale=1 on every display.
# Valid: 1, 2, 3, or 4.
# Can also be set with the --2x command-line flag (CLI takes precedence).
scale = 1

# Scroll wheel sensitivity: pixels of trackpad/wheel movement per PS/2 detent.
# Lower = faster scroll; higher = slower. Tune to taste for your hardware.
# 40 works well for most Linux trackpads; try 80–120 if scroll is too fast.
#mouse_scroll_pixels_per_line = 40

# RAM bank sizes in MB.
# On the Indy and Indigo2 each bank must be 0 (absent), 8, 16, 32, 64, or 128
# (the IP28 also 256 or 512). The SGI Indy shipped with up to two populated
# banks; banks 2 and 3 are typically absent. Total RAM = sum of non-zero banks.
# Up to eight entries; most machines use four. On the O2 each entry is the kit
# in a DIMM pair: 32, 64, 128 or 256 MB, largest first. HELP.md lists the
# sizes the other machines take.
banks = [128, 128, 0, 0]

# NAT subnet for the internal network (CIDR notation).
# The gateway gets host .1 and IRIX gets host .2.
# Change this if 192.168.0.x conflicts with your local network.
#nat_subnet = "192.168.5.0/24"

# Disks, CD-ROMs and cards are [[devices]] entries. `at` names the slot:
# scsi0/t1 is target 1 of the first SCSI controller, scsi1/t4 target 4 of the second.
# Left out, a device takes the first free slot that fits. `iris --list-slots` shows
# every slot of the machine and its aliases.
# Valid targets: 1–7 (1–15 on the Octane, the SN0 machines, Fuel and Tezro). The
# SCSI controller itself occupies ID 0.
# Typical Indy layout:
#   t1 — internal hard disk
#   t4 — internal CD-ROM (removable, 512-byte block mode)
#   t6 — optional second hard disk or tape

# Internal hard disk
[[devices]]
type = "hdd"
at   = "scsi0/t1"
path = "scsi1.raw"
#overlay = true
#write_cache = false  # default true. false stores every write before it completes, like SGI's drives (slower); true can lose ~5 s of writes in a host crash. See STORAGE.md.

# Second hard disk. The Indigo2 and O2 have a second controller, scsi1 (on the O2 the external bus);
# the same target can be used on both.
#[[devices]]
#type = "hdd"
#at   = "scsi0/t2"
#path = "scsi2.raw"

# Scratch volume for host<->guest file injection without networking.
#          tar cf - /var/log/foo | dd of=/dev/rdsk/dks0d2s0 bs=512 conv=notrunc
#   host:  iris CI: scratch-read {to_path: "log.tar"}
# IRIX raw block-device reads must be sector-aligned (bs must be a multiple
# of 512); bs=64 etc returns "Read error: I/O error".
# Implies overlay=false (the volume must be host-writable, and
# scratch contents intentionally survive snapshot rollback so a freshly
# injected bundle isn't reverted).
#[[devices]]
#type    = "hdd"
#at      = "scsi0/t2"
#path    = "scratch.raw"
#scratch = true
#size_mb = 64

# DaynaPort SCSI/Link — Ethernet over the SCSI bus (SCSI type 3, Processor).
# Requires a driver in the guest; IRIX
# has none in the box (see github.com/techomancer/irixdayna, where it shows up
# as dp0). Has no disk image: path/discs/overlay/scratch don't apply.
#   mac    — optional; default 00:80:19:44:50:<scsi-id>
#   subnet — optional; this target's own NAT subnet (gateway .1, guest .2).
#            Must differ from nat_subnet (ec0's). Default 192.168.10.0/24.
# See docs/dev/daynaport.md.
#[[devices]]
#type   = "daynaport"
#at     = "scsi0/t3"
#mac    = "00:80:19:12:34:56"
#subnet = "192.168.10.0/24"

# NFS share, served in-process by the NAT gateway (NFSv2 for IRIX 5.3, NFSv3
# for 6.x — nothing to install on the host). The export is a single root.
# From IRIX: mount <gateway_ip>:/ /mnt  (default gateway: 192.168.0.1)
[nfs]
shared_dir = "./shared"
#version = "auto"   # "auto" (default), "v2" or "v3"

# Port forwarding rules — forward host ports into the guest (IRIX).
# proto:      "tcp" or "udp"
# host_port:  port to listen on on the host
# guest_port: port inside the VM to forward to
# bind:       "localhost" (loopback only, default) or "any" (all interfaces)
#
# Example: forward host TCP 2323 → IRIX telnet (23), localhost only:
[[port_forward]]
proto      = "tcp"
host_port  = 2323
guest_port = 23
bind       = "localhost"
#
# Example: forward host UDP 5353 → IRIX port 5353, all interfaces:
#[[port_forward]]
#proto      = "udp"
#host_port  = 5353
#guest_port = 5353
#bind       = "any"

#[[port_forward]]
#proto      = "udp"
#host_port  = 7777
#guest_port = 7
#bind       = "localhost"


# Internal CD-ROM.
# For a single disc, set path only. A path (or a discs entry) may also be an
# http:// or https:// URL; the server must answer Range requests (STORAGE.md).
# For a changer (cycled with "scsi eject 4" in the monitor), list all
# ISO images in `discs`; the first entry is mounted at startup.
#[[devices]]
#type  = "cdrom"
#at    = "scsi0/t4"
#path  = "cdrom4.iso"
#discs = ["second.iso", "cdrom4.iso", "patches.iso"]

# Runtime disc switching (no extra config needed).
# Load any ISO/CHD at runtime by pressing Ctrl+F12 (RCtrl+F12 in the standalone
# window, Ctrl/Cmd+F12 in the GUI) and picking a file. Behaviour follows the
# number of discs queued for the drive:
#   - empty tray: the picked disc simply loads
#   - one disc:   loading another replaces it
#   - two+ discs: ejecting cycles through them; a single disc ejects to empty
# `path` is optional: omit it (or comment it out) to boot with an empty tray and
# insert media later.
#[[devices]]
#type = "cdrom"
#at   = "scsi0/t4"
#path = "cdrom4.iso"   # optional — omit to start with an empty tray

# VINO video-in (IndyCam). Off by default.
# source:   "off" | "test_pattern" | "black" | "camera"
# standard: "ntsc" | "pal"
#[vino]
#source       = "camera"
#standard     = "ntsc"
#camera_index = 0

# ── Networking backend ────────────────────────────────────────────────────────
# mode = "nat"  (default) : built-in software NAT gateway (DHCP/DNS/ICMP/TCP/UDP
#                           + the [[port_forward]] rules above). No host
#                           privileges or extra libraries needed.
# mode = "pcap"           : bridge the guest's raw Ethernet frames onto a real
#                           host interface (requires building with --features
#                           pcap and elevated privileges). The guest becomes a
#                           real L2 host on your LAN; NAT services and port
#                           forwarding do NOT apply in this mode.
#
# List candidate interfaces:  iris --list-net-interfaces
#   (or, in the monitor:      net interfaces)
#
# pcap_interface accepts EITHER:
#   - a 1-based index from --list-net-interfaces, e.g. "1"  (easiest, esp. Windows)
#   - an exact device name, e.g. "eth0" / "en0"
#   - omit it entirely: if launched from a terminal you'll get an interactive
#     menu to pick the interface; if there's no console (headless/CI) it
#     auto-picks the first up, non-loopback NIC.
#
# IMPORTANT (Windows): device names look like \Device\NPF_{GUID}. Backslashes are
# escape characters inside a normal "double-quoted" TOML string, so you MUST use a
# 'single-quoted' TOML *literal* string (no escaping), or just use the index.
#
# NOTE: the [network] header below is REQUIRED. If you uncomment `mode`/
# `pcap_interface` but leave `[network]` commented out, the keys land in the
# top-level table and are rejected as unknown (the emulator will refuse to
# start) — they only take effect under the [network] table.

[network]
mode           = "nat"
#pcap_interface = "1"                                          # by index (recommended)
#pcap_interface = "wlan0"                                     # by name (Linux/macOS)
#pcap_interface = '\Device\NPF_{385F30D0-9166-45D3-BBC6-F1D9C5300AF9}'  # Windows (literal '...' string!)
# Ethernet station address for ec0. Defaults to 08:00:69:12:34:56 (SGI's OUI)
# when unset. Backdoor-injected into NVRAM (Indy) / serial EEPROM (Indigo2)
# before boot — no need to `setenv eaddr` by hand at the PROM monitor.
#mac            = "08:00:69:12:34:56"

# N64 development board (Ultra64 GIO card). Needs the ultra64 branch of
# github.com/techomancer/gopher64, which maps the shared-memory bridge
# (/iris_n64_bridge). See HELP.md.
#[[devices]]
#type = "ultra64"
#at   = "gio0"

# ── Machine ───────────────────────────────────────────────────────────────────
# profile: "indy_ip24" (default), "indigo2_ip22" (same as --ip22), "indigo2_ip28",
#          "o2_ip32", "octane_ip30", "origin200_ip29", "origin2000_ip27",
#          "onyx2_ip27", "fuel_ip34", "tezro_ip53", "origin3200_ip35" or
#          "onyx3000_ip35" (same as --machine). The *.toml.example files in the
#          repository root are starting points for the larger machines.
# cpu:     "r4400" (default) or "r5000" on the Indy and Indigo2 (same as --cpu).
#          Every CPU is in every build; HELP.md lists each machine's.
#[machine]
#profile = "indy_ip24"
#cpu     = "r4400"

# Per-config NVRAM files, so two installs don't overwrite each other's PROM env.
# These are top-level keys: put them near the top of the file, above any
# [section], if you uncomment them.
#nvram    = "nvram.bin"
#nveeprom = "nveeprom.bin"   # Indigo2 only

# Graphics: board "newport" (default), or GR2 "xz" (Indy or Indigo2) /
# "extreme" (Indigo2); "solidimpact", "highimpact", "maximpact". The Octane
# takes the IMPACT boards (default "solidimpact"), the VPro boards "v6", "v8",
# "v10", "v12", or "none"; HELP.md lists the other machines' boards.
# heads 1 or 2; resolution "guest" (IRIX/PROM programs VC2), "1024x768",
# "1280x960" or "1280x1024".
#[graphics]
#board      = "newport"
#heads      = 1
#resolution = "guest"
#raster     = "cpu"         # "wgpu" needs that feature; Newport is experimental and has no CPU fallback
#newport_mode = "direct"    # Newport wgpu only: "direct" or explicit slow "readback" compatibility
#gpu_backend = "auto"       # Newport wgpu initially accepts Vulkan or D3D12

# CP0 Count frequency in MHz. Default: half the CPU's clock (75 for the Indy's
# 150 MHz R4400), which IRIX reports as the CPU's MHz. Set it only if a guest
# needs another rate; IRIX then reports twice this value.
#[clock]
#fixed_mhz = 33

# Start the guest's real-time clock offset from the host's current time. Every
# field is optional and signed (-n or +n). Years/months step the calendar, the
# rest add as time. Applied once at startup; the RTC holds 1970-2039.
#[rtc_offset]
#years   = -18
#months  = -4
#days    = -2
#hours   = -13
#minutes = -4
#seconds = -27

# Host audio output, for every sound device (HAL2, the O2's, RAD, ICE1724).
#[audio]
#host       = "default"   # the platform's own: PulseAudio/PipeWire on Linux, WASAPI on Windows,
#                         # CoreAudio on macOS; or "pulse", "wasapi", "coreaudio", "null" (discard)
#prebuf_ms  = 20          # sound held before playing: the margin against a late guest, and the latency added
#latency_ms = 20          # what the host's device buffers; unset: its low-latency default
#channels   = 2           # speakers for the Tezro's multichannel card: 2, 4, 6 or 8
#file       = "out.wav"   # play into a 48 kHz 16-bit WAV file instead of a sound card

# Built-in VNC server. Off unless listen is set (or --vnc is given).
#[vnc]
#listen        = "127.0.0.1:5900"
#max_fps       = 30
#password_file = "vnc-password.txt"   # or IRIS_VNC_PASSWORD; with neither, no password: keep listen on 127.0.0.1

# Host thread pinning.
#[perf]
#thread_affinity = true
#cpu_core        = 2
#rex3_core       = 3
#refresh_core    = 4

# jitv2 (--features jitv2): compile-pool threads (same as --jitv2-threads;
# unset, one per guest CPU, at most 4),
# and the persistent on-disk compiled-page cache across runs (see
# docs/jitv2-persistent-cache.md). cache_dir blank/unset = the platform's
# user cache directory; a directory that doesn't exist yet is created.
#[jitv2]
#threads   = 1
#compile   = "async"   # "sync": compile on the CPU thread (one CPU only)
#cache     = false
#cache_dir = ""

# Debug knobs, applied as environment variables at start.
#[debug]
#no_idle        = false      # IRIS_NO_IDLE: disable idle park (idle-pause builds)
#gui_gl_capture = false      # IRIS_GUI_GL: iris-gui GL capture renderer
#log            = "scsi,net" # trace points to enable at startup (--log); was debug_log
#startup        = ["rex trace /tmp/rex.txt"] # monitor commands to run before the CPU starts
