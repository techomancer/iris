name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    # ready_for_review: marking a draft ready starts the full set below.
    types: [ opened, synchronize, reopened, ready_for_review ]

# One run per pull request; a new push cancels the run it replaces. Main
# pushes are never cancelled and get a group per commit, so none queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Runner images match release.yml: ubuntu-24.04 (glibc floor), macos-26 (pinned
# through GitHub's macos-15 -> macos-26 migration; arm64), windows-latest (x64).
# fail-fast is off so one platform breaking still reports the others.
#
# Pull requests run Linux x86-64, Linux arm64 and Windows. macOS joins them on
# pushes to main: its runners wait longest, and from 2026-10-13 to 2026-11-10
# no pull request's macOS job failed on its code where Linux passed.
#
# Draft pull requests run the Linux x86-64 test and the script lint only, so
# work in progress doesn't hold runners that pull requests being landed need.
# Windows, arm64 Linux and the release-features build start when the pull
# request is marked ready for review.
jobs:
  # Default features, every workspace crate.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(
          github.event_name != 'pull_request' && '["ubuntu-24.04","ubuntu-24.04-arm","windows-latest","macos-26"]' ||
          github.event.pull_request.draft && '["ubuntu-24.04"]' ||
          '["ubuntu-24.04","ubuntu-24.04-arm","windows-latest"]') }}
    steps:
    - uses: actions/checkout@v5
    # rust-toolchain.toml pins nightly; `rustup show` installs it up front so a
    # toolchain download doesn't land inside the Build step's timing.
    - name: Install pinned toolchain
      run: rustup show
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
    # Pull requests restore main's cache but never save their own, so they
    # cannot push main's entries out of the repository's 10 GB cache quota.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # v2.90.3
      with:
        tool: nextest
    # --workspace, not the default. Without it cargo only builds and tests the
    # root `iris` package, so iris-gui was never compiled here at all and its
    # tests never ran — a GUI-only breakage could not turn this red. It needs no
    # extra system packages: wayland, X11 and GL are dlopen'd at runtime, so the
    # only thing it links is libasound, which is already installed above.
    - name: Build
      run: cargo build --workspace --verbose
    - name: Check REX3 GPU replay
      run: cargo check -p iris --lib --example rex3-gpu-probe --features rex-gpu
    - name: Test REX3 GPU matcher
      if: runner.os == 'Linux'
      run: cargo test -p iris --lib --features rex-gpu rex3_gpu::tests
    # The VPro fragment pipeline's SIMD kernels against their scalar
    # formulas, on every level the runner's CPU has (src/dev/odyssey/pipe/
    # lanes.rs): deterministic, so they gate everywhere. macos-26 and
    # ubuntu-24.04-arm are the runners with NEON.
    - name: Run SIMD lane tests
      run: cargo test -p iris --lib the_lane_
    # nextest runs each test in its own process and writes the JUnit report
    # the annotations below come from. It does not run doctests.
    # Only Linux x86-64 fails the job; the other platforms report a failure
    # (a red step, which the API still counts as a pass) and carry on.
    - name: Run tests
      continue-on-error: ${{ matrix.os != 'ubuntu-24.04' }}
      run: cargo nextest run --workspace --profile ci
    - name: Run doctests
      continue-on-error: ${{ matrix.os != 'ubuntu-24.04' }}
      run: cargo test --workspace --doc
    - uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce  # v6.7.1
      if: ${{ !cancelled() }}
      with:
        report_paths: target/nextest/ci/junit.xml
        annotate_only: true

  # The nightly/release CLI feature set (scripts/dist/lib.sh): a build check
  # only, so a platform-specific break in the Cranelift JITs or the lightning
  # interpreter path turns CI red before a nightly does. Pull requests build
  # it on Linux x86-64 and Windows; main adds macOS. A build, not a check, so
  # hostgl's link against the platform's GL is covered too.
  features:
    name: Build release features (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04","windows-latest","macos-26"]') }}
    steps:
    - uses: actions/checkout@v5
    - name: Install pinned toolchain
      run: rustup show
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libgl-dev  # hostgl links libGL
    # Pull requests restore main's cache but never save their own, so they
    # cannot push main's entries out of the repository's 10 GB cache quota.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Build
      run: cargo build --release -p iris --bins --features lightning,jitv2,gpujit,idle-pause,hostgl
    # Needs this build: lightning, and fat LTO from the release profile.
    - name: Check the interpreter's hot paths
      if: runner.os == 'Linux'
      run: tools/hot-path-check.sh target/release/iris
    - name: Build opt-in REX3 dirty uploads
      run: |
        cargo build -p iris --features rex-dirty-upload
        cargo build -p iris-gui --features rex-dirty-upload
    - name: Test REX3 dirty uploads
      if: runner.os == 'Linux'
      run: |
        cargo test -p iris --test rex3_dirty --features rex-dirty-upload
        cargo test -p iris --lib --features rex-dirty-upload go_damage_classifies_planes_bounds_and_non_writes
        cargo test -p iris --lib --features rex-dirty-upload register_traffic_is_clean_and_draws_publish_selected_plane

  # The distribution scripts run only in nightly and release builds, so lint
  # them here where a mistake shows up on the pull request.
  dist-scripts:
    name: Lint scripts/dist
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
    - run: shellcheck -x -S warning scripts/dist/*.sh scripts/build-macos.sh
    - name: Version strings
      run: |
        [ "$(scripts/dist/version.sh release v1.2.3)" = 1.2.3 ]
        [ "$(scripts/dist/version.sh nightly 2026-01-05)" = nightly.2026.01.05 ]
        ! scripts/dist/version.sh release v1.2 2>/dev/null
    - name: Release notes render
      run: scripts/dist/release-notes.sh --channel nightly --version nightly.2026.01.05 --tag nightly
