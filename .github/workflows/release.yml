# Release build: pushing a tag vX.Y.Z builds that commit and publishes it as
# release X.Y.Z, marked as the latest release. X.Y.Z is the version everywhere:
# the About window, --version, the macOS app, the installers and file names.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Re-running for a tag that already has a release replaces that release. To do
# that without pushing anything, use Actions > Release > Run workflow and name
# the tag.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v1.2.3
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      # The feature sets releases ship with, the same as nightlies.
      gui_features: iris/lightning,iris/jitv2,iris/gpujit,iris/idle-pause,hostgl
      cli_features: lightning,jitv2,gpujit,idle-pause,hostgl
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(scripts/dist/version.sh release "$TAG")
          SHA=$(git rev-parse HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building release \`$VERSION\` from \`${SHA:0:8}\`." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      gui_features: ${{ needs.prepare.outputs.gui_features }}
      cli_features: ${{ needs.prepare.outputs.cli_features }}

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Release notes
        run: >
          scripts/dist/release-notes.sh --channel release
          --version "${{ needs.prepare.outputs.version }}"
          --tag "${{ needs.prepare.outputs.tag }}" --gui-features "${{ needs.prepare.outputs.gui_features }}"
          --cli-features "${{ needs.prepare.outputs.cli_features }}"
          -o "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          scripts/dist/publish-github.sh
          --tag "${{ needs.prepare.outputs.tag }}"
          --sha "${{ needs.prepare.outputs.sha }}"
          --title "IRIS ${{ needs.prepare.outputs.version }}"
          --notes "$RUNNER_TEMP/notes.md" --dir dist
