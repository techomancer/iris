# Bare-metal benchmark suite (bench/).
#
# CI gates the ACCURACY score, not the performance numbers. A shared runner's
# throughput varies by more than most real regressions, so a perf threshold
# here would either be so loose it catches nothing or so tight it fires every
# other week. What does not vary is whether the emulator computed the right
# answer: every kernel checksums its result against a golden value produced by
# building the same C natively, and the suite's exit code is the number of
# mismatches. That is a genuine regression net, and it covers ground cpu-tests
# cannot — instruction-level tests run one operation at a time with clean
# state, while these run millions with whatever state the last million left.
#
# The performance figures are still collected and uploaded, so a run can be
# read after the fact or compared by hand across commits.

name: Benchmark

on:
  push:
    branches: [ "main" ]
    paths:
      - 'bench/**'
      - 'cpu-tests/harness/**'
      - 'src/mips_*.rs'
      - 'src/jitv2/**'
      - 'src/testdev.rs'
      - 'src/bench_report.rs'
      - 'src/bench_runner.rs'
      - 'src/benchsuite.rs'
      - 'src/bin/iris_bench.rs'
      - '.github/workflows/bench.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'bench/**'
      - 'cpu-tests/harness/**'
      - 'src/mips_*.rs'
      - 'src/jitv2/**'
      - 'src/testdev.rs'
      - 'src/bench_report.rs'
      - 'src/bench_runner.rs'
      - 'src/benchsuite.rs'
      - 'src/bin/iris_bench.rs'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-guest:
    name: Build the guest binary and the oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the MIPS cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu binutils-mips-linux-gnu

      # golden.h is generated from the kernels themselves and checked in, so
      # building the suite needs nothing but the cross toolchain. Regenerating
      # here and failing on a diff is what stops the kernels and their expected
      # values from drifting apart — and doubles as a determinism check on the
      # suite itself, since a kernel whose result depends on uninitialised
      # memory or on the host's byte order produces a different table on a
      # different runner. Every one of those has already happened once; see
      # rules/testing/benchmark-suite-gotchas.md.
      - name: Verify the golden checksums are up to date
        run: |
          make -C bench golden
          git diff --exit-code bench/golden/golden.h

      - name: Build irisbench.elf
        run: make -C bench

      # bench/prebuilt/irisbench.elf is linked into `iris` with include_bytes!
      # so the benchmark runs on a machine with no cross toolchain — a released
      # app, a sandboxed one, or anyone who just wants the number. A checked-in
      # build product that can drift is worse than no build product, and this
      # one drifts dangerously: accuracy is scored against golden checksums
      # compiled *into* the image, so a stale image against fresh goldens
      # reports failures to users that are not real.
      - name: The checked-in guest binary must match what we just built
        run: |
          make -C bench prebuilt
          if ! git diff --exit-code bench/prebuilt/; then
            echo "::error::bench/prebuilt/irisbench.elf is stale."
            echo "::error::Run 'make -C bench prebuilt' and commit the result."
            exit 1
          fi

      # One binary for every cell below — same as cpu-tests, and for the same
      # reason: a differential comparison needs the guest side held constant.
      - uses: actions/upload-artifact@v4
        with:
          name: irisbench-elf
          path: bench/build/irisbench.elf
          if-no-files-found: error

  host-baseline:
    name: Host baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same kernels, natively. Its accuracy score must be 100% by
      # construction — it is the source of the golden values — so a failure
      # here means a kernel is not deterministic even against itself.
      - name: Build and run
        run: |
          make -C bench hostbench
          ./bench/build/irisbench-host | tee bench/build/host.log
      - name: The oracle must agree with itself
        run: grep -q 'IRIS-BENCH-DONE rc=0' bench/build/host.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-host-log
          path: bench/build/host.log
          if-no-files-found: ignore

  run:
    name: ${{ matrix.cpu }} / ${{ matrix.engine }}
    needs: build-guest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cpu: [r4400, r5000]
        engine: [interp, jitv2]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: actions/download-artifact@v4
        with:
          name: irisbench-elf
          path: bench/build

      - uses: Swatinem/rust-cache@v2

      # The CPU model and the JIT are compile-time cargo features, not runtime
      # switches — see rules/perf/hardware-profiles.md. Plain r5k only, for the
      # reasons cpu-tests.yml sets out at length.
      - name: Build IRIS
        run: |
          FEATURES=""
          [ "${{ matrix.cpu }}" = "r5000" ] && FEATURES="r5k"
          [ "${{ matrix.engine }}" = "jitv2" ] && FEATURES="${FEATURES:+$FEATURES,}jitv2"
          if [ -n "$FEATURES" ]; then
            cargo build --release --bin iris --features "$FEATURES"
          else
            cargo build --release --bin iris
          fi
          cargo build --release --bin iris-bench

      # --iris is required, not decorative: without it `run` measures this
      # process, and iris-bench is built with default features rather than the
      # cell's. The cell is the binary built in the step above, so name it.
      - name: Run the suite
        run: |
          chmod +x bench/build/irisbench.elf
          ./target/release/iris-bench run \
            --iris ./target/release/iris \
            --label "${{ matrix.cpu }}-${{ matrix.engine }}" \
            --timeout 2400 \
            2>&1 | tee bench/build/run.log

      # Three ways this can fail quietly, so all three are checked. A build
      # whose features did not take runs the wrong CPU and every result is
      # mislabelled; the guest's banner is authoritative because it reads PRId.
      # A kernel that faults is stepped over by the exception dispatcher and
      # still reports a throughput. And a mismatch is the actual regression.
      - name: Check the run
        run: |
          python3 - <<'PY'
          import json, sys, glob
          paths = glob.glob("bench/build/results/*.json")
          if not paths:
              sys.exit("::error::no result file was written")
          run = json.load(open(paths[0]))
          want = "${{ matrix.cpu }}".upper()
          if run["machine"]["cpu"] != want:
              sys.exit(f"::error::guest reports {run['machine']['cpu']}, expected {want}")
          if not run["machine"]["timebase"]:
              sys.exit("::error::no host time base — every timing is a guess")

          expect_exc = {"sys/exception", "sys/tlb_miss"}
          bad = [r for r in run["rows"] if r["status"] == "MISMATCH"]
          exc = [r for r in run["rows"] if r["exc"] and r["name"] not in expect_exc]
          for r in bad:
              print(f"::error::{r['name']} checksum {r['checksum']} != {r['golden']}")
          for r in exc:
              print(f"::error::{r['name']} took {r['exc']} unexpected exceptions")

          mips = run["total_icount"] * 1e3 / max(run["total_ns"], 1)
          print(f"{run['cell']}: {run['matched']}/{run['checked']} matched, "
                f"{mips:.1f} guest MIPS, {run['total_ns']/1e9:.1f} s timed")
          sys.exit(1 if bad or exc else 0)
          PY

      # The path a released application actually takes: no subprocess, no ELF on
      # disk, the guest image read straight out of the binary. Quick mode so it
      # costs about half a minute on top of the full run above. Only on the
      # default cell — the embedded runner is the same code in every cell, and
      # what it exercises is the plumbing, not the CPU model.
      - name: The embedded runner must work too
        if: matrix.cpu == 'r4400' && matrix.engine == 'interp'
        run: cargo test --release --lib bench_runner -- --ignored --nocapture

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.cpu }}-${{ matrix.engine }}
          path: |
            bench/build/run.log
            bench/build/results/*.json
          if-no-files-found: ignore

  report:
    name: Comparison report
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: artifacts
          merge-multiple: true
      - name: Assemble
        run: |
          mkdir -p bench/build/results
          find artifacts -name '*.json' -exec cp {} bench/build/results/ \; || true
          if [ -z "$(ls -A bench/build/results 2>/dev/null)" ]; then
            echo "no results to report"; exit 0
          fi
          cargo build --release --bin iris-bench
          ./target/release/iris-bench report --format md > bench/build/report.md
          cat bench/build/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: bench/build/report.md
          if-no-files-found: ignore
